<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true"></span>{{ site.short_name }}
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#focus' | relative_url }}">Focus</a>
      <a href="{{ '/#writing' | relative_url }}">Writing</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
{% if page.toc %}
  <div class="toc-bar">
    <div class="wrap">
      <button type="button" class="toc-bar-toggle" aria-expanded="false" aria-controls="toc-bar-list">
        <span class="toc-bar-label">On this page</span>
        <span class="toc-bar-current"></span>
        <svg class="toc-bar-chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ol class="toc-bar-list" id="toc-bar-list" hidden></ol>
    </div>
  </div>
{% endif %}
</header>
