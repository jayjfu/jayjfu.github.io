- title: LLM training from scratch
  summary: Minimal implementations of pretraining, post-training and evaluation, used to understand each stage end to end.
  tags: [LLM, training]

- title: Retrieval & ranking
  summary: Search, recommendation and ads seen through retrieval and ranking, with reproductions of recent industry work.
  tags: [retrieval, ranking]

- title: VLMs as teachers
  summary: Open-vocabulary detection, with VLMs pseudo-labeling data for small, fast student models.
