# Home page "Focus" section. Each area is one classification, shown in order.
#   topics:   tags (usually one Highlights tag from _data/tags.yml); clicking a topic filters Writing to posts carrying ALL its tags
#   projects: cards shown under the area; a project with `status` also appears in the intro's "Now" line
- title: LLM Training
  id: llm-training
  summary: Pretraining, post-training and evaluation of language models, with a focus on code and on adapting a model to one person.
  topics:
    - title: Post-training LLMs for coding
      summary: SFT, RL and preference optimization aimed at coding tasks and coding agents.
      tags: [LLM Coding]
    - title: LLM training from scratch
      summary: Minimal implementations of every stage, used to understand it end to end.
      tags: [LLM Training]
    - title: Personalized LLMs
      summary: Memory, preference learning and user-level evaluation.
      tags: [LLM Personalization]
  projects:
    - title: LLM Training Lab
      kind: LLM · Training
      year: 2026
      status: In progress
      summary: Pretraining, post-training and evaluation in one hands-on lab, plus a running tracker of what frontier LLM labs ship.
      links:
        - { label: Code, url: "https://github.com/jayjfu/llm-training-lab" }
    - title: tiny-instructgpt
      kind: LLM · Post-training
      year: 2026
      summary: The InstructGPT recipe at small scale. SFT, a reward model, PPO and DPO on Llama-3.2-1B.
      links:
        - { label: Code, url: "https://github.com/jayjfu/tiny-instructgpt" }
    - title: Coding Agent Playbook
      kind: Agents
      year: 2026
      summary: A local coding agent built from scratch, step by step. It works on thread workspaces or real repos and has an optional Docker sandbox.
      links:
        - { label: Code, url: "https://github.com/jayjfu/coding-agent-playbook" }

- title: Retrieval and Ranking
  id: retrieval-ranking
  summary: Search, recommendation and ads seen through retrieval and ranking. I've shipped ranking improvements in production and keep reproducing recent industry work.
  topics:
    - title: Search, recommendation and ads
      summary: Reproductions and notes on recent retrieval and ranking systems.
      tags: [Retrieval and Ranking]
  projects:
    - title: Semantic Search Pipeline
      kind: Retrieval · Ranking
      year: 2026
      summary: An end-to-end semantic search stack covering dense retrieval, indexing and evaluation.
      links:
        - { label: Code, url: "https://github.com/jayjfu/semantic-search-pipeline" }

- title: Vision-Language Models
  id: vision-language
  summary: Open-vocabulary detection, with VLMs pseudo-labeling data for small, fast student models.
  topics:
    - title: VLMs as teachers
      summary: Auto-labeling with a VLM teacher and distilling into a lightweight detector.
      tags: [Vision-Language Models]
  projects:
    - title: Open-vocabulary Auto-labeling for Autonomous Driving
      kind: Vision · VLM
      year: 2026
      status: In progress
      summary: A Grounding DINO teacher pseudo-labels BDD100K, and a lightweight YOLO student learns from those labels. The student is compared with the teacher and with a model trained on human labels.
      links:
        - { label: Code, url: "https://github.com/jayjfu/open-vocab-autolabel" }
