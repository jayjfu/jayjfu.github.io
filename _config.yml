# ---- Edit these ----
title: Jian (Jay) Fu
author: Jian (Jay) Fu
short_name: Jay Fu
description: Machine learning engineer working on search, ranking and large language models. Research notes, findings and experiments.
url: "https://jayjfu.github.io"   # your GitHub Pages URL
baseurl: ""
location: San José, California
email: jayjfu0@gmail.com
social:
  github: jayjfu
  linkedin: jayfu0
  scholar: ""         # full Google Scholar URL
  x: ""               # handle without @

# ---- Build ----
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax   # emits \( \) / \[ \]; rendered client-side by KaTeX
  hard_wrap: false

permalink: /blog/:year/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      math: true
      toc: true

exclude: [README.md, Gemfile, Gemfile.lock, vendor, .github]
